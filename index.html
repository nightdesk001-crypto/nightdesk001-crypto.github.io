<h1>もしも検証ラボ</h1>
<p>YouTubeチャンネル「もしも検証ラボ」の運営者が、自分のチャンネルに自分で作った動画をアップロードするためのツールです。</p>

<h2>プライバシーポリシー</h2>
<ul>
  <li>このツールは、運営者本人のYouTubeアカウントにだけ接続し、動画のアップロードとチャンネル名の確認だけに使います。</li>
  <li>取得した情報を第三者に提供・販売することはありません。</li>
  <li>認証情報は運営者のパソコン内にだけ保存し、外部には送りません。</li>
  <li>アクセスの取り消しは、Googleアカウントの「サードパーティ製のアプリとサービス」からいつでも行えます。</li>
</ul>
